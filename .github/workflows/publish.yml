name: Publish

# Publishing is triggered by a GitHub Release rather than a push, so cutting a
# version is a deliberate act with a changelog attached. The tag is the source
# of truth and is checked against package.json before anything leaves the runner.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for short-lived publish rights. Without
  # it the publish step falls back to looking for a token and fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@dontbullymeillcode/react-glitch
    steps:
      - uses: actions/checkout@v7

      # v7 or newer is required, not just preferred: earlier versions export a
      # dummy NODE_AUTH_TOKEN of "XXXXX-XXXXX-XXXXX-XXXXX" when no token is
      # given, which lands a non-functional token in .npmrc and breaks the OIDC
      # publish below with a 403. See actions/setup-node#1558.
      - uses: actions/setup-node@v7
        with:
          # Matches CI, so what ships is what was tested.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10, and trusted publishing needs 11.5.1 or newer.
      # Without this the publish fails on an unrecognised auth flow.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "Publishing ${version}"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Show the OIDC claims npm will match
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          TOKEN="$token" node -e '
            const [, payload] = process.env.TOKEN.split(".")
            const c = JSON.parse(Buffer.from(payload, "base64url").toString())
            console.log(JSON.stringify({ sub: c.sub, repository: c.repository,
              repository_owner: c.repository_owner, workflow_ref: c.workflow_ref,
              environment: c.environment, ref: c.ref }, null, 2))
          '

      # npm publishes to `latest` whatever the semver says, so a prerelease
      # would otherwise become the version every plain `npm install` gets.
      - name: Publish to npm
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
